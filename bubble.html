<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Honeycomb Effect</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #f2f2f2;
      cursor: default;
    }
  </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let W = window.innerWidth;
  let H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

  const colors = [
    "#14148f",
    "#304ffe",
    "#00a7ff",
    "#12b886",
    "#6acb28",
    "#ff9500",
    "#ff3b82",
    "#9b3cff"
  ];

  const bubbles = [];
  const flyingBubbles = [];
  const swingBubbles = [];
  const particles = [];

  const occupiedSlots = new Set();
  let slots = [];

  const CELL_R = 18;
  const MAX_BUBBLES = 260;
  const SPAWN_INTERVAL = 260;

  let lastSpawn = 0;
  let lastSwingSpawn = 0;
  let time = 0;

  const cluster = {
    x: W * 0.66,
    y: H * 0.48
  };

  const nozzle = {
    x: W * 0.24,
    y: H * 0.52,
    lastX: W * 0.24,
    lastY: H * 0.52,
    vx: 0,
    vy: 0
  };

  const pin = {
    x: W * 0.20,
    y: H * 0.78
  };

  let dragTarget = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    cluster.x = W * 0.66;
    cluster.y = H * 0.48;

    rebuildSlots();
  }

  window.addEventListener("resize", resizeCanvas);

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function distance(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function getRainbowStroke(x, y, r) {
    const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    g.addColorStop(0.00, "#14148f");
    g.addColorStop(0.18, "#304ffe");
    g.addColorStop(0.34, "#00a7ff");
    g.addColorStop(0.50, "#12b886");
    g.addColorStop(0.66, "#ff9500");
    g.addColorStop(0.82, "#ff3b82");
    g.addColorStop(1.00, "#9b3cff");
    return g;
  }

  function rebuildSlots() {
    slots = [];

    const radiusX = Math.min(W * 0.28, 340);
    const radiusY = Math.min(H * 0.34, 210);

    const dx = CELL_R * Math.sqrt(3);
    const dy = CELL_R * 1.5;

    let id = 0;

    for (let row = -10; row <= 10; row++) {
      for (let col = -15; col <= 15; col++) {
        const offsetX = row % 2 === 0 ? 0 : dx / 2;

        const x = cluster.x + col * dx + offsetX;
        const y = cluster.y + row * dy;

        const nx = (x - cluster.x) / radiusX;
        const ny = (y - cluster.y) / radiusY;

        const organicEdge =
          Math.sin(col * 1.2 + row * 1.8) * 0.12 +
          Math.cos(col * 0.8 - row * 1.5) * 0.08;

        if (nx * nx + ny * ny < 1.05 + organicEdge) {
          slots.push({
            id: id++,
            x,
            y,
            row,
            col
          });
        }
      }
    }

    const startX = nozzle.x + 90;
    const startY = nozzle.y;

    slots.sort((a, b) => {
      const da = distance(a.x, a.y, startX, startY);
      const db = distance(b.x, b.y, startX, startY);
      return da - db;
    });
  }

  function getNextFreeSlot() {
    for (const slot of slots) {
      if (!occupiedSlots.has(slot.id)) {
        return slot;
      }
    }
    return null;
  }

  function getNozzleTip() {
    return {
      x: nozzle.x + 76,
      y: nozzle.y
    };
  }

  function spawnFlyingBubble() {
    if (bubbles.length + flyingBubbles.length >= MAX_BUBBLES) return;

    const slot = getNextFreeSlot();
    if (!slot) return;

    occupiedSlots.add(slot.id);

    const start = getNozzleTip();

    flyingBubbles.push({
      x: start.x,
      y: start.y,
      startX: start.x,
      startY: start.y,
      targetX: slot.x,
      targetY: slot.y,
      slotId: slot.id,
      r: random(10, 15),
      progress: 0,
      speed: random(0.008, 0.014),
      wobble: random(0, Math.PI * 2)
    });
  }

  function spawnSwingBubble() {
    const now = performance.now();

    if (now - lastSwingSpawn < 45) return;

    const speed = Math.sqrt(nozzle.vx * nozzle.vx + nozzle.vy * nozzle.vy);

    if (speed < 3.5) return;

    lastSwingSpawn = now;

    const tip = getNozzleTip();

    const count = speed > 13 ? 3 : speed > 8 ? 2 : 1;

    for (let i = 0; i < count; i++) {
      swingBubbles.push({
        x: tip.x + random(-6, 6),
        y: tip.y + random(-6, 6),
        r: random(9, 22),
        vx: nozzle.vx * 0.18 + random(-1.2, 1.2),
        vy: nozzle.vy * 0.18 + random(-1.2, 1.2),
        life: 1,
        wobble: random(0, Math.PI * 2)
      });
    }
  }

  function updateFlyingBubbles() {
    const now = performance.now();

    if (dragTarget !== "nozzle") {
      if (now - lastSpawn > SPAWN_INTERVAL) {
        spawnFlyingBubble();
        lastSpawn = now;
      }
    } else {
      spawnSwingBubble();
    }

    for (let i = flyingBubbles.length - 1; i >= 0; i--) {
      const b = flyingBubbles[i];

      b.progress += b.speed;

      const t = easeOutCubic(Math.min(b.progress, 1));
      const wave = Math.sin(t * Math.PI * 2 + b.wobble) * 18 * (1 - t);

      b.x = b.startX + (b.targetX - b.startX) * t;
      b.y = b.startY + (b.targetY - b.startY) * t + wave;

      if (b.progress >= 1) {
        bubbles.push({
          x: b.targetX,
          y: b.targetY,
          r: CELL_R,
          slotId: b.slotId,
          birth: time,
          wobble: random(0, Math.PI * 2)
        });

        flyingBubbles.splice(i, 1);
      }
    }
  }

  function updateSwingBubbles() {
    for (let i = swingBubbles.length - 1; i >= 0; i--) {
      const b = swingBubbles[i];

      b.x += b.vx;
      b.y += b.vy;

      b.vx *= 0.985;
      b.vy *= 0.985;

      b.vy -= 0.015;

      b.x += Math.sin(time * 0.03 + b.wobble) * 0.12;
      b.y += Math.cos(time * 0.025 + b.wobble) * 0.08;

      b.life -= 0.004;

      if (
        b.life <= 0 ||
        b.x < -100 ||
        b.x > W + 100 ||
        b.y < -100 ||
        b.y > H + 100
      ) {
        swingBubbles.splice(i, 1);
      }
    }
  }

  function getHexPoints(cx, cy, r, seed) {
    const points = [];

    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 3 * i + Math.PI / 6;
      const organic =
        Math.sin(time * 0.025 + seed + i * 1.6) * 1.4 +
        Math.cos(seed * 0.7 + i) * 0.8;

      points.push({
        x: cx + Math.cos(angle) * (r + organic),
        y: cy + Math.sin(angle) * (r + organic)
      });
    }

    return points;
  }

  function drawHoneycombCell(bubble, index) {
    const bornScale = Math.min((time - bubble.birth) / 18, 1);
    const r = bubble.r * (0.4 + bornScale * 0.6);

    const points = getHexPoints(bubble.x, bubble.y, r, bubble.wobble);

    for (let i = 0; i < points.length; i++) {
      const p1 = points[i];
      const p2 = points[(i + 1) % points.length];

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = colors[(i + index) % colors.length];
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.stroke();
    }
  }

  function drawFlyingBubble(b) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = getRainbowStroke(b.x, b.y, b.r);
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  function drawSwingBubble(b) {
    ctx.save();
    ctx.globalAlpha = b.life;

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.strokeStyle = getRainbowStroke(b.x, b.y, b.r);
    ctx.lineWidth = 2.4;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.28, b.y - b.r * 0.28, b.r * 0.18, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(20, 20, 143, 0.6)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.restore();
  }

  function drawNozzle() {
    ctx.save();
    ctx.translate(nozzle.x, nozzle.y);

    ctx.lineWidth = 2.4;
    ctx.strokeStyle = "#14148f";

    ctx.beginPath();
    ctx.ellipse(-12, 0, 14, 30, 0, 0, Math.PI * 2);
    ctx.stroke();

    const g = ctx.createLinearGradient(-5, 0, 82, 0);
    g.addColorStop(0, "#14148f");
    g.addColorStop(0.25, "#304ffe");
    g.addColorStop(0.5, "#ff3b82");
    g.addColorStop(0.75, "#ff9500");
    g.addColorStop(1, "#12b886");

    ctx.strokeStyle = g;
    ctx.beginPath();
    ctx.moveTo(-2, -22);
    ctx.bezierCurveTo(22, -18, 50, -14, 76, -5);
    ctx.bezierCurveTo(86, -2, 86, 2, 76, 5);
    ctx.bezierCurveTo(50, 14, 22, 18, -2, 22);
    ctx.stroke();

    ctx.strokeStyle = "#14148f";
    ctx.beginPath();
    ctx.moveTo(-10, 30);
    ctx.lineTo(-10, 92);
    ctx.stroke();

    ctx.restore();
  }

  function getPinTip() {
    return {
      x: pin.x - 8,
      y: pin.y + 82
    };
  }

  function drawPin() {
    ctx.save();
    ctx.translate(pin.x, pin.y);

    ctx.strokeStyle = "#14148f";
    ctx.lineWidth = 2.4;

    ctx.beginPath();
    ctx.ellipse(0, -24, 13, 26, 0.35, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-30, 58);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-8, 82);
    ctx.lineTo(-22, 142);
    ctx.lineTo(4, 88);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
  }

  function drawLeftSmallBubbles() {
    ctx.save();
    ctx.translate(nozzle.x - 135, nozzle.y - 10);

    ctx.strokeStyle = "#14148f";
    ctx.lineWidth = 2.4;

    ctx.beginPath();
    ctx.arc(0, -18, 13, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 14, 13, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function createBurst(x, y) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x,
        y,
        vx: Math.cos((Math.PI * 2 / 14) * i) * random(1, 3),
        vy: Math.sin((Math.PI * 2 / 14) * i) * random(1, 3),
        life: 1,
        color: colors[i % colors.length]
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.035;

      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function checkPinCollision() {
    const tip = getPinTip();

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];

      if (distance(tip.x, tip.y, b.x, b.y) < b.r + 8) {
        occupiedSlots.delete(b.slotId);
        createBurst(b.x, b.y);
        bubbles.splice(i, 1);
      }
    }

    for (let i = flyingBubbles.length - 1; i >= 0; i--) {
      const b = flyingBubbles[i];

      if (distance(tip.x, tip.y, b.x, b.y) < b.r + 8) {
        occupiedSlots.delete(b.slotId);
        createBurst(b.x, b.y);
        flyingBubbles.splice(i, 1);
      }
    }

    for (let i = swingBubbles.length - 1; i >= 0; i--) {
      const b = swingBubbles[i];

      if (distance(tip.x, tip.y, b.x, b.y) < b.r + 8) {
        createBurst(b.x, b.y);
        swingBubbles.splice(i, 1);
      }
    }
  }

  function hitNozzle(x, y) {
    return (
      x > nozzle.x - 45 &&
      x < nozzle.x + 100 &&
      y > nozzle.y - 50 &&
      y < nozzle.y + 110
    );
  }

  function hitPin(x, y) {
    return (
      x > pin.x - 50 &&
      x < pin.x + 30 &&
      y > pin.y - 60 &&
      y < pin.y + 150
    );
  }

  canvas.addEventListener("mousedown", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (hitNozzle(mx, my)) {
      dragTarget = "nozzle";
      dragOffsetX = mx - nozzle.x;
      dragOffsetY = my - nozzle.y;
      nozzle.lastX = nozzle.x;
      nozzle.lastY = nozzle.y;
    } else if (hitPin(mx, my)) {
      dragTarget = "pin";
      dragOffsetX = mx - pin.x;
      dragOffsetY = my - pin.y;
    }
  });

  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    if (dragTarget === "nozzle") {
      const newX = clamp(mx - dragOffsetX, 80, W - 120);
      const newY = clamp(my - dragOffsetY, 80, H - 130);

      nozzle.vx = newX - nozzle.x;
      nozzle.vy = newY - nozzle.y;

      nozzle.x = newX;
      nozzle.y = newY;

      canvas.style.cursor = "grab";
    } else if (dragTarget === "pin") {
      pin.x = clamp(mx - dragOffsetX, 50, W - 60);
      pin.y = clamp(my - dragOffsetY, 80, H - 180);
      canvas.style.cursor = "grab";
    } else {
      if (hitNozzle(mx, my) || hitPin(mx, my)) {
        canvas.style.cursor = "grab";
      } else {
        canvas.style.cursor = "default";
      }
    }
  });

  window.addEventListener("mouseup", () => {
    dragTarget = null;
    nozzle.vx = 0;
    nozzle.vy = 0;
    canvas.style.cursor = "default";
  });

  function draw() {
    time++;

    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#f2f2f2";
    ctx.fillRect(0, 0, W, H);

    updateFlyingBubbles();
    updateSwingBubbles();
    checkPinCollision();
    updateParticles();

    for (let i = 0; i < bubbles.length; i++) {
      drawHoneycombCell(bubbles[i], i);
    }

    for (const b of flyingBubbles) {
      drawFlyingBubble(b);
    }

    for (const b of swingBubbles) {
      drawSwingBubble(b);
    }

    drawParticles();

    drawLeftSmallBubbles();
    drawNozzle();
    drawPin();

    requestAnimationFrame(draw);
  }

  rebuildSlots();
  draw();
</script>

</body>
</html>
