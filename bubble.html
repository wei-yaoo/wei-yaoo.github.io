<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubbles</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: transparent;
      touch-action: none;
    }

    .nav-icon {
      display: block;
      position: fixed;
      top: 8px;
      width: 24px;
      height: 24px;
      mix-blend-mode: exclusion;
      z-index: 256;
    }

    .nav-icon.logo    { right: 8px; }
    .nav-icon.github  { right: 40px; }
  </style>
</head>

<body>

      <path fill="#fff" d="M 20 23 A 8 8 0 1 0 36 23 A 8 8 0 1 0 20 23 Z M 32 11 A 3 3 0 1 0 38 11 A 3 3 0 1 0 32 11 Z"></path>

<canvas id="bubbleCanvas"></canvas>

<script>
  const canvas = document.getElementById("bubbleCanvas");
  const ctx = canvas.getContext("2d");

  let W = 0;
  let H = 0;
  let time = 0;

  const colors = [
    "#17229b",
    "#245bff",
    "#19b7ff",
    "#19bf77",
    "#73c928",
    "#ff9f1a",
    "#ff4b9b",
    "#9b45ff"
  ];

  const mouse = {
    x: 0,
    y: 0
  };

  const nozzle = {
    x: 0,
    y: 0,
    angle: 0,
    oldX: 0,
    oldY: 0,
    speed: 0,
    offsetX: 0,
    offsetY: 0,
    homeX: 0,
    homeY: 0
  };

  const pin = {
    x: 0,
    y: 0,
    angle: 0,
    offsetX: 0,
    offsetY: 0,
    homeX: 0,
    homeY: 0
  };

  let dragTarget = null;

  const bubbles = [];
  const particles = [];
  let slots = [];
  let bubbleId = 0;
  let lastAutoEmit = 0;
  let lastSwingEmit = 0;

  const CELL_R = 17;
  const MAX_BUBBLES = 230;

  function resizeCanvas() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    buildSlots();

    // 响应式定位 nozzle / pin（左下二列排布），对准气泡簇中心
    const cx = W * 0.58;
    const cy = H * 0.40;

    nozzle.homeX = W * 0.26;
    nozzle.homeY = H * 0.80;
    pin.homeX    = W * 0.56;
    pin.homeY    = H * 0.80;

    // 首次（或用户未拖拽离开前）同步到 home 位置并朝气泡簇
    if (!nozzle._placed) {
      nozzle.x = nozzle.oldX = nozzle.homeX;
      nozzle.y = nozzle.oldY = nozzle.homeY;
      nozzle.angle = Math.atan2(cy - nozzle.y, cx - nozzle.x);
      nozzle._placed = true;
    } else {
      nozzle.x = clamp(nozzle.x, 50, W - 50);
      nozzle.y = clamp(nozzle.y, 50, H - 50);
    }

    if (!pin._placed) {
      pin.x = pin.homeX;
      pin.y = pin.homeY;
      pin.angle = 0;     // 原版 pin 默认水平向右
      pin._placed = true;
    } else {
      pin.x = clamp(pin.x, 50, W - 50);
      pin.y = clamp(pin.y, 50, H - 50);
    }
  }

  window.addEventListener("resize", resizeCanvas);

  function getPointer(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function distance(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);
  }

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function rotatePoint(px, py, cx, cy, angle) {
    const s = Math.sin(angle);
    const c = Math.cos(angle);
    const x = px - cx;
    const y = py - cy;

    return {
      x: x * c - y * s + cx,
      y: x * s + y * c + cy
    };
  }

  function rainbowGradient(x, y, r) {
    const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);

    g.addColorStop(0.00, colors[0]);
    g.addColorStop(0.14, colors[1]);
    g.addColorStop(0.28, colors[2]);
    g.addColorStop(0.42, colors[3]);
    g.addColorStop(0.58, colors[4]);
    g.addColorStop(0.72, colors[5]);
    g.addColorStop(0.86, colors[6]);
    g.addColorStop(1.00, colors[7]);

    return g;
  }

  function buildSlots() {
    slots = [];

    const cx = W * 0.58;
    const cy = H * 0.40;
    const rx = Math.min(W * 0.23, 310);
    const ry = Math.min(H * 0.36, 250);

    const dx = CELL_R * 1.48;
    const dy = CELL_R * 1.28;

    let id = 0;

    for (let row = -14; row <= 14; row++) {
      for (let col = -14; col <= 14; col++) {
        const offset = row % 2 === 0 ? 0 : dx * 0.5;

        const x = cx + col * dx + offset;
        const y = cy + row * dy;

        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;

        const organic =
          Math.sin(col * 1.2 + row * 0.9) * 0.10 +
          Math.cos(col * 0.6 - row * 1.4) * 0.06;

        // 竖向拉长版椭圆蛋形
        if (nx * nx * 1.05 + ny * ny * 0.95 < 1.00 + organic) {
          slots.push({
            id: id++,
            x,
            y,
            used: false,
            releaseTime: 0,       // GREEN2-B-RED-2：最近释放的帧时间戳
            sortIndex: id         // 缓存原始 sort 序号，用于 fallback
          });
        }
      }
    }

    // 按"左下 → 右上"的优先级排序（先下后上，先左后右，从喷嘴侧开始堆积）
    slots.sort((a, b) => {
      return (b.y - a.y) + (a.x - b.x) * 0.28;
    });

    // GREEN2-B-RED-2：排序后更新 sortIndex（按排序后位置，0 = 最左下优先）
    for (let i = 0; i < slots.length; i++) slots[i].sortIndex = i;
  }

  const FRESH_SLOT_FRAMES = 300;   // GREEN2：释放后 5 秒内算"新鲜洞"，优先填补

  function getFreeSlot() {
    // GREEN2-B-RED-2：优先选"最近被释放的新鲜洞"，没有再 fallback 到左下顺序第一个空
    let best = null;
    let bestScore = Infinity;

    for (const slot of slots) {
      if (slot.used) continue;

      const age = slot.releaseTime ? (time - slot.releaseTime) : Infinity;
      let score;

      if (age < FRESH_SLOT_FRAMES) {
        // 新鲜洞：按 age 从小到大（越近越优先）
        score = age;
      } else {
        // 普通空槽：用 sortIndex 作为顺序，前面加一个偏移量保证排在所有新鲜洞之后
        score = FRESH_SLOT_FRAMES + slot.sortIndex;
      }

      if (score < bestScore) {
        bestScore = score;
        best = slot;
      }
    }

    return best;
  }

  function releaseSlot(slot) {
    if (!slot) return;
    slot.used = false;
    slot.releaseTime = time;   // GREEN2-B-RED-2：记录释放帧时间戳，用于优先补洞
  }

  function getNozzleTip() {
    const localX = 18;
    const localY = 0;

    return rotatePoint(
      nozzle.x + localX,
      nozzle.y + localY,
      nozzle.x,
      nozzle.y,
      nozzle.angle
    );
  }

  function getPinTip() {
    const localX = 42;
    const localY = 0;

    return rotatePoint(
      pin.x + localX,
      pin.y + localY,
      pin.x,
      pin.y,
      pin.angle
    );
  }

  function hitNozzle(x, y) {
    return distance(x, y, nozzle.x, nozzle.y) < 48;
  }

  function hitPin(x, y) {
    return distance(x, y, pin.x, pin.y) < 54;
  }

  function emitToCluster() {
    if (bubbles.length > MAX_BUBBLES) return;

    const slot = getFreeSlot();
    if (!slot) return;

    slot.used = true;

    const start = getNozzleTip();

    const dx = Math.cos(nozzle.angle);
    const dy = Math.sin(nozzle.angle);

    bubbles.push({
      id: bubbleId++,
      mode: "flying",
      x: start.x,
      y: start.y,
      startX: start.x,
      startY: start.y,
      targetX: slot.x,
      targetY: slot.y,
      controlX: start.x + dx * random(90, 180),
      controlY: start.y + dy * random(40, 90) + random(-60, 60),
      slot,
      r: random(10, 14),
      t: 0,
      speed: random(0.007, 0.013),
      wobble: random(0, Math.PI * 2),
      born: time
    });
  }

  function emitBySwing() {
    const now = performance.now();

    if (now - lastSwingEmit < 42) return;
    if (nozzle.speed < 3.5) return;

    lastSwingEmit = now;

    const tip = getNozzleTip();

    const dx = Math.cos(nozzle.angle);
    const dy = Math.sin(nozzle.angle);

    const count = nozzle.speed > 16 ? 4 : nozzle.speed > 9 ? 3 : 2;

    for (let i = 0; i < count; i++) {
      bubbles.push({
        id: bubbleId++,
        mode: "free",
        x: tip.x + random(-5, 5),
        y: tip.y + random(-5, 5),
        vx: dx * random(2.2, 4.8) + random(-1.4, 1.4) + nozzle.speed * 0.08,
        vy: dy * random(2.2, 4.8) + random(-1.4, 1.4),
        r: random(8, 17),
        life: 1,
        wobble: random(0, Math.PI * 2),
        born: time
      });
    }
  }

  function updateEmission(now) {
    if (dragTarget === "nozzle") {
      emitBySwing();
    } else {
      if (now - lastAutoEmit > 230) {
        emitToCluster();
        lastAutoEmit = now;
      }
    }

    nozzle.speed *= 0.88;
  }

  function updateBubbles() {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];

      if (b.mode === "flying") {
        b.t += b.speed;

        const t = easeOutCubic(Math.min(b.t, 1));
        const mt = 1 - t;

        b.x =
          mt * mt * b.startX +
          2 * mt * t * b.controlX +
          t * t * b.targetX;

        b.y =
          mt * mt * b.startY +
          2 * mt * t * b.controlY +
          t * t * b.targetY +
          Math.sin(t * Math.PI * 2 + b.wobble) * 12 * (1 - t);

        if (b.t >= 1) {
          b.mode = "settled";
          b.x = b.targetX;
          b.y = b.targetY;
          b.r = CELL_R;
          b.birth = time;
        }
      }

      if (b.mode === "settled") {
        b.wobble += 0.025;
      }

      if (b.mode === "free") {
        b.x += b.vx;
        b.y += b.vy;

        b.vx *= 0.985;
        b.vy *= 0.985;
        b.vy -= 0.01;

        b.x += Math.sin(time * 0.03 + b.wobble) * 0.12;
        b.y += Math.cos(time * 0.025 + b.wobble) * 0.08;

        b.life -= 0.004;

        if (
          b.life <= 0 ||
          b.x < -80 ||
          b.x > W + 80 ||
          b.y < -80 ||
          b.y > H + 80
        ) {
          bubbles.splice(i, 1);
        }
      }
    }
  }

  function createBurst(x, y) {
    for (let i = 0; i < 16; i++) {
      particles.push({
        x,
        y,
        vx: Math.cos((Math.PI * 2 / 16) * i) * random(1.2, 3.4),
        vy: Math.sin((Math.PI * 2 / 16) * i) * random(1.2, 3.4),
        life: random(18, 32),
        maxLife: 32,
        color: colors[i % colors.length]
      });
    }
  }

  function updatePinPop() {
    const tip = getPinTip();

    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];

      const r = b.mode === "settled" ? b.r * 0.92 : b.r;

      if (distance(tip.x, tip.y, b.x, b.y) < r + 7) {
        if (b.slot) releaseSlot(b.slot);
        createBurst(b.x, b.y);
        bubbles.splice(i, 1);
      }
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;

      p.vx *= 0.96;
      p.vy *= 0.96;

      p.life--;

      if (p.life <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function softCellPoints(x, y, r, seed, sides = 8) {
    const points = [];

    for (let i = 0; i < sides; i++) {
      const angle = (Math.PI * 2 / sides) * i + Math.PI / 8;
      const rr =
        r *
        (0.95 +
          Math.sin(time * 0.018 + seed + i * 1.2) * 0.055 +
          Math.cos(seed * 0.7 + i) * 0.035);

      points.push({
        x: x + Math.cos(angle) * rr,
        y: y + Math.sin(angle) * rr
      });
    }

    return points;
  }

  function drawSoftCell(b, index) {
    const bornScale = b.birth ? Math.min((time - b.birth) / 18, 1) : 1;
    const r = b.r * (0.45 + bornScale * 0.55);

    const points = softCellPoints(b.x, b.y, r, b.wobble, 8);

    ctx.save();

    ctx.beginPath();

    for (let i = 0; i < points.length; i++) {
      const current = points[i];
      const next = points[(i + 1) % points.length];
      const midX = (current.x + next.x) / 2;
      const midY = (current.y + next.y) / 2;

      if (i === 0) {
        const prev = points[points.length - 1];
        ctx.moveTo((prev.x + current.x) / 2, (prev.y + current.y) / 2);
      }

      ctx.quadraticCurveTo(current.x, current.y, midX, midY);
    }

    ctx.closePath();

    ctx.lineWidth = 2.15;
    ctx.strokeStyle = rainbowGradient(b.x, b.y, r);
    ctx.stroke();

    ctx.globalAlpha = 0.035;
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();
  }

  function drawFlyingCircle(b) {
    ctx.save();

    // —— B-RED-3：flying 模式出生前 8 帧从小弹出（弹出式缩放）
    // —— B-RED-1：free  模式半径随 life 衰减（收缩淡出）
    let radiusScale = 1;

    if (b.life !== undefined) {
      // free 挥甩气泡：随 life 收缩 + 淡出
      radiusScale = Math.max(b.life, 0);
      ctx.globalAlpha = radiusScale;
    } else if (b.born !== undefined) {
      // flying 发射气泡：刚出生 8 帧内从 40% 放大到 100%（弹出）
      const age = time - b.born;
      if (age < 8) {
        const t = age / 8;
        radiusScale = 0.40 + t * 0.60;
      }
    }

    const r = b.r * radiusScale;

    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = rainbowGradient(b.x, b.y, r);
    ctx.stroke();

    // 高光点：同步跟随半径缩放 + alpha（free 时再乘 0.18）
    const alpha = (b.life !== undefined ? Math.max(b.life, 0) : 1) * 0.18;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(b.x - r * 0.28, b.y - r * 0.28, r * 0.20, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.restore();
  }

  function drawNozzle() {
    ctx.save();
    ctx.translate(nozzle.x, nozzle.y);
    ctx.rotate(nozzle.angle);

    ctx.lineWidth = 2.8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#17229b";

    // 主体连接环（水滴形吹泡环的椭圆基座）
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 25, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 短连接杆（从主体椭圆下方延伸，连接到握柄顶部椭圆）
    ctx.beginPath();
    ctx.moveTo(-3, 23);
    ctx.lineTo(-6, 34);
    ctx.stroke();

    // 握柄：两个竖叠的椭圆环（原版造型）
    ctx.beginPath();
    ctx.ellipse(-8, 46, 12, 18, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(-8, 74, 12, 18, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 吹泡口尖端曲线（彩虹渐变）
    const tip = 18;
    const g = ctx.createLinearGradient(0, -22, tip, 22);
    g.addColorStop(0.00, "#17229b");
    g.addColorStop(0.35, "#ff4b9b");
    g.addColorStop(0.70, "#ff9f1a");
    g.addColorStop(1.00, "#19bf77");

    ctx.strokeStyle = g;
    ctx.lineWidth = 2.2;

    ctx.beginPath();
    ctx.moveTo(8, -20);
    ctx.quadraticCurveTo(20, -6, 18, 0);
    ctx.quadraticCurveTo(20, 6, 8, 20);
    ctx.stroke();

    ctx.restore();
  }

  function drawPin() {
    ctx.save();
    ctx.translate(pin.x, pin.y);
    ctx.rotate(pin.angle);

    ctx.lineWidth = 2.6;
    ctx.strokeStyle = "#17229b";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.beginPath();
    ctx.ellipse(-12, 0, 12, 22, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(44, 0);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(44, 0);
    ctx.lineTo(28, -8);
    ctx.lineTo(28, 8);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];

      if (b.mode === "settled") {
        drawSoftCell(b, i);
      }
    }

    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i];

      if (b.mode === "flying" || b.mode === "free") {
        drawFlyingCircle(b);
      }
    }

    drawParticles();
    drawNozzle();
    drawPin();
  }

  canvas.addEventListener("pointerdown", (e) => {
    const p = getPointer(e);
    mouse.x = p.x;
    mouse.y = p.y;

    if (hitNozzle(p.x, p.y)) {
      dragTarget = "nozzle";
      nozzle.offsetX = p.x - nozzle.x;
      nozzle.offsetY = p.y - nozzle.y;
      nozzle.oldX = nozzle.x;
      nozzle.oldY = nozzle.y;
    } else if (hitPin(p.x, p.y)) {
      dragTarget = "pin";
      pin.offsetX = p.x - pin.x;
      pin.offsetY = p.y - pin.y;
    }

    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    const p = getPointer(e);
    mouse.x = p.x;
    mouse.y = p.y;

    if (dragTarget === "nozzle") {
      const newX = clamp(p.x - nozzle.offsetX, 50, W - 50);
      const newY = clamp(p.y - nozzle.offsetY, 50, H - 50);

      const dx = newX - nozzle.x;
      const dy = newY - nozzle.y;

      nozzle.speed = Math.hypot(dx, dy);

      if (nozzle.speed > 0.4) {
        nozzle.angle = Math.atan2(dy, dx);
      }

      nozzle.x = newX;
      nozzle.y = newY;
    }

    if (dragTarget === "pin") {
      const newX = clamp(p.x - pin.offsetX, 50, W - 50);
      const newY = clamp(p.y - pin.offsetY, 50, H - 50);

      const dx = newX - pin.x;
      const dy = newY - pin.y;

      if (Math.hypot(dx, dy) > 0.5) {
        pin.angle = Math.atan2(dy, dx);
      }

      pin.x = newX;
      pin.y = newY;
    }

    if (hitNozzle(p.x, p.y) || hitPin(p.x, p.y) || dragTarget) {
      canvas.style.cursor = "grab";
    } else {
      canvas.style.cursor = "default";
    }
  });

  canvas.addEventListener("pointerup", (e) => {
    dragTarget = null;
    nozzle.speed = 0;
    canvas.releasePointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointercancel", () => {
    dragTarget = null;
    nozzle.speed = 0;
  });

  function animate(now = 0) {
    time++;

    updateEmission(now);
    updateBubbles();
    updatePinPop();
    updateParticles();
    draw();

    requestAnimationFrame(animate);
  }

  resizeCanvas();
  animate();
</script>
</body>
</html>
