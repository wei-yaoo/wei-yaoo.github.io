<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bubble Interaction</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ececec;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="bubbleCanvas"></canvas>

  <script>
    const canvas = document.getElementById("bubbleCanvas");
    const ctx = canvas.getContext("2d");

    let W = 0;
    let H = 0;
    let animationId = null;

    const rainbow = [
      "#2136b6",
      "#2d63ff",
      "#21c8ff",
      "#34c759",
      "#9ad22b",
      "#ff9f0a",
      "#ff5e8a",
      "#d94bff"
    ];

    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      buildSlots();
    }

    function dist(x1, y1, x2, y2) {
      return Math.hypot(x2 - x1, y2 - y1);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function rotatePoint(px, py, cx, cy, angle) {
      const s = Math.sin(angle);
      const c = Math.cos(angle);
      const x = px - cx;
      const y = py - cy;
      return {
        x: x * c - y * s + cx,
        y: x * s + y * c + cy
      };
    }

    const mouse = {
      x: 0,
      y: 0,
      down: false
    };

    let draggingTarget = null;

    /* ========= 喷嘴（采用图二样式，只留一个） ========= */
    const nozzle = {
      x: 210,
      y: 240,
      angle: -0.2,
      dragOffsetX: 0,
      dragOffsetY: 0,
      lastX: 210,
      lastY: 240,
      speed: 0
    };

    /* ========= 炸泡泡的针 ========= */
    const pin = {
      x: 180,
      y: 430,
      angle: -0.25,
      dragOffsetX: 0,
      dragOffsetY: 0
    };

    /* ========= 泡泡数据 ========= */
    let bubbles = [];
    let particles = [];
    let bubbleIdSeed = 0;
    let slots = [];
    let lastEmitTime = 0;

    /* ========= 堆积区域 ========= */
    function buildSlots() {
      slots = [];

      const centerX = W * 0.72;
      const centerY = H * 0.50;
      const rx = Math.min(230, W * 0.22);
      const ry = Math.min(220, H * 0.30);
      const spacing = 26;

      let rowIndex = 0;

      for (let y = -ry; y <= ry; y += spacing * 0.92) {
        const offset = rowIndex % 2 === 0 ? 0 : spacing * 0.43;

        for (let x = -rx; x <= rx; x += spacing * 0.86) {
          const px = x + offset;

          const nx = px / rx;
          const ny = y / ry;

          const shape = nx * nx * 0.92 + ny * ny * 1.02;

          if (shape < 1) {
            slots.push({
              x: centerX + px,
              y: centerY + y,
              used: false,
              bubbleId: null,
              order: (centerX + px) + Math.abs(y) * 0.16
            });
          }
        }

        rowIndex++;
      }

      slots.sort((a, b) => a.order - b.order);
    }

    function getFreeSlot() {
      for (let i = 0; i < slots.length; i++) {
        if (!slots[i].used) return slots[i];
      }
      return null;
    }

    function releaseSlot(bubble) {
      if (!bubble.slot) return;
      bubble.slot.used = false;
      bubble.slot.bubbleId = null;
      bubble.slot = null;
    }

    /* ========= 图形绘制 ========= */
    function createRainbowGradient(x, y, r) {
      const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
      g.addColorStop(0.00, rainbow[0]);
      g.addColorStop(0.14, rainbow[1]);
      g.addColorStop(0.28, rainbow[2]);
      g.addColorStop(0.42, rainbow[3]);
      g.addColorStop(0.58, rainbow[4]);
      g.addColorStop(0.72, rainbow[5]);
      g.addColorStop(0.86, rainbow[6]);
      g.addColorStop(1.00, rainbow[7]);
      return g;
    }

    /* 柔和一点的泡泡轮廓 */
    function drawSoftBubble(b) {
      const sides = 8;
      const points = [];

      for (let i = 0; i < sides; i++) {
        const ang = b.rot + (Math.PI * 2 / sides) * i;
        const rr = b.r * (0.92 + 0.08 * Math.sin(b.wobble + i * 0.9));
        points.push({
          x: b.x + Math.cos(ang) * rr,
          y: b.y + Math.sin(ang) * rr
        });
      }

      ctx.save();

      const grad = createRainbowGradient(b.x, b.y, b.r * 1.2);

      ctx.beginPath();

      for (let i = 0; i < points.length; i++) {
        const current = points[i];
        const next = points[(i + 1) % points.length];
        const midX = (current.x + next.x) * 0.5;
        const midY = (current.y + next.y) * 0.5;

        if (i === 0) {
          const prev = points[points.length - 1];
          const startX = (prev.x + current.x) * 0.5;
          const startY = (prev.y + current.y) * 0.5;
          ctx.moveTo(startX, startY);
        }

        ctx.quadraticCurveTo(current.x, current.y, midX, midY);
      }

      ctx.closePath();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = grad;
      ctx.stroke();

      ctx.globalAlpha = 0.08;
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
      });
    }

    /* 喷嘴：采用图二样式 */
    function drawNozzle() {
      ctx.save();
      ctx.translate(nozzle.x, nozzle.y);
      ctx.rotate(nozzle.angle);

      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1d2ea8";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      /* 圆环 */
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 24, 0, 0, Math.PI * 2);
      ctx.stroke();

      /* 手柄 */
      ctx.beginPath();
      ctx.moveTo(-3, 22);
      ctx.lineTo(-18, 62);
      ctx.stroke();

      ctx.restore();
    }

    /* 针 */
    function drawPin() {
      ctx.save();
      ctx.translate(pin.x, pin.y);
      ctx.rotate(pin.angle);

      ctx.lineWidth = 3;
      ctx.strokeStyle = "#1d2ea8";
      ctx.lineJoin = "round";
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(-4, -10);
      ctx.lineTo(12, 0);
      ctx.lineTo(-4, 10);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(-28, 0);
      ctx.stroke();

      ctx.restore();
    }

    function getNozzleTip() {
      const localTip = { x: 18, y: 0 };
      const p = rotatePoint(
        nozzle.x + localTip.x,
        nozzle.y + localTip.y,
        nozzle.x,
        nozzle.y,
        nozzle.angle
      );
      return p;
    }

    function getPinTip() {
      const localTip = { x: 12, y: 0 };
      const p = rotatePoint(
        pin.x + localTip.x,
        pin.y + localTip.y,
        pin.x,
        pin.y,
        pin.angle
      );
      return p;
    }

    /* ========= 交互：拖动喷嘴和针 ========= */
    function hitNozzle(mx, my) {
      return dist(mx, my, nozzle.x, nozzle.y) < 42;
    }

    function hitPin(mx, my) {
      return dist(mx, my, pin.x, pin.y) < 32;
    }

    canvas.addEventListener("mousedown", (e) => {
      mouse.down = true;
      mouse.x = e.clientX;
      mouse.y = e.clientY;

      if (hitNozzle(mouse.x, mouse.y)) {
        draggingTarget = "nozzle";
        nozzle.dragOffsetX = mouse.x - nozzle.x;
        nozzle.dragOffsetY = mouse.y - nozzle.y;
        nozzle.lastX = nozzle.x;
        nozzle.lastY = nozzle.y;
      } else if (hitPin(mouse.x, mouse.y)) {
        draggingTarget = "pin";
        pin.dragOffsetX = mouse.x - pin.x;
        pin.dragOffsetY = mouse.y - pin.y;
      }
    });

    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;

      if (draggingTarget === "nozzle") {
        nozzle.x = mouse.x - nozzle.dragOffsetX;
        nozzle.y = mouse.y - nozzle.dragOffsetY;

        const dx = nozzle.x - nozzle.lastX;
        const dy = nozzle.y - nozzle.lastY;
        nozzle.speed = Math.hypot(dx, dy);

        if (nozzle.speed > 0.5) {
          nozzle.angle = Math.atan2(dy, dx);
        }

        nozzle.lastX = nozzle.x;
        nozzle.lastY = nozzle.y;
      }

      if (draggingTarget === "pin") {
        const oldX = pin.x;
        const oldY = pin.y;

        pin.x = mouse.x - pin.dragOffsetX;
        pin.y = mouse.y - pin.dragOffsetY;

        const dx = pin.x - oldX;
        const dy = pin.y - oldY;

        if (Math.hypot(dx, dy) > 0.5) {
          pin.angle = Math.atan2(dy, dx);
        }
      }
    });

    window.addEventListener("mouseup", () => {
      mouse.down = false;
      draggingTarget = null;
    });

    /* ========= 吐泡泡 ========= */
    function emitBubble() {
      const tip = getNozzleTip();

      const power = draggingTarget === "nozzle"
        ? clamp(2.2 + nozzle.speed * 0.18, 2.2, 8.5)
        : 2.4;

      const dirX = Math.cos(nozzle.angle);
      const dirY = Math.sin(nozzle.angle);

      const count = draggingTarget === "nozzle" && nozzle.speed > 5 ? 2 : 1;

      for (let i = 0; i < count; i++) {
        const r = 10 + Math.random() * 4;

        bubbles.push({
          id: bubbleIdSeed++,
          x: tip.x + dirX * 8 + (Math.random() - 0.5) * 6,
          y: tip.y + dirY * 8 + (Math.random() - 0.5) * 6,
          vx: dirX * power + (Math.random() - 0.5) * 0.8,
          vy: dirY * power + (Math.random() - 0.5) * 0.8,
          r: r,
          rot: Math.random() * Math.PI * 2,
          wobble: Math.random() * Math.PI * 2,
          settled: false,
          slot: null
        });
      }
    }

    /* ========= 泡泡运动和堆积 ========= */
    function trySettleBubble(b) {
      if (b.settled) return;

      const freeSlot = getFreeSlot();
      if (!freeSlot) return;

      freeSlot.used = true;
      freeSlot.bubbleId = b.id;
      b.slot = freeSlot;
      b.settled = true;
      b.vx *= 0.2;
      b.vy *= 0.2;
    }

    function updateBubbles() {
      const settleZoneX = W * 0.48;

      for (let i = 0; i < bubbles.length; i++) {
        const b = bubbles[i];

        b.rot += 0.01;
        b.wobble += 0.03;

        if (!b.settled) {
          b.x += b.vx;
          b.y += b.vy;

          b.vx *= 0.992;
          b.vy *= 0.992;

          /* 有轻微漂浮感 */
          b.vy += Math.sin(performance.now() * 0.001 + b.id) * 0.003;

          /* 到达堆积区域后开始堆积 */
          if (b.x > settleZoneX) {
            trySettleBubble(b);
          } else {
            /* 如果碰到已经堆好的泡泡，也会加入堆积 */
            for (let j = 0; j < bubbles.length; j++) {
              if (i === j) continue;
              const other = bubbles[j];
              if (!other.settled) continue;

              if (dist(b.x, b.y, other.x, other.y) < b.r + other.r + 4) {
                trySettleBubble(b);
                break;
              }
            }
          }
        } else if (b.slot) {
          const dx = b.slot.x - b.x;
          const dy = b.slot.y - b.y;

          b.vx += dx * 0.03;
          b.vy += dy * 0.03;

          b.vx *= 0.82;
          b.vy *= 0.82;

          b.x += b.vx;
          b.y += b.vy;
        }
      }

      /* 堆积泡泡之间轻微分离，避免过硬 */
      for (let i = 0; i < bubbles.length; i++) {
        const a = bubbles[i];
        if (!a.settled) continue;

        for (let j = i + 1; j < bubbles.length; j++) {
          const b = bubbles[j];
          if (!b.settled) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy);
          const minD = a.r * 1.55;

          if (d > 0 && d < minD) {
            const overlap = (minD - d) * 0.06;
            const nx = dx / d;
            const ny = dy / d;

            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;
          }
        }
      }
    }

    /* ========= 炸泡泡 ========= */
    function popBubble(index) {
      const b = bubbles[index];
      releaseSlot(b);

      for (let i = 0; i < 12; i++) {
        particles.push({
          x: b.x,
          y: b.y,
          vx: (Math.random() - 0.5) * 3.5,
          vy: (Math.random() - 0.5) * 3.5,
          r: 1.8 + Math.random() * 1.5,
          life: 28 + Math.random() * 10,
          maxLife: 38,
          color: rainbow[Math.floor(Math.random() * rainbow.length)]
        });
      }

      bubbles.splice(index, 1);
    }

    function updatePinPop() {
      const tip = getPinTip();

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (dist(tip.x, tip.y, b.x, b.y) < b.r + 5) {
          popBubble(i);
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    /* ========= 自动吐泡泡 + 挥动增强 ========= */
    function updateEmission(now) {
      let interval = 220;

      if (draggingTarget === "nozzle") {
        interval = clamp(220 - nozzle.speed * 18, 50, 220);
      }

      if (now - lastEmitTime > interval) {
        emitBubble();
        lastEmitTime = now;
      }

      nozzle.speed *= 0.9;
    }

    /* ========= 绘制 ========= */
    function draw() {
      ctx.clearRect(0, 0, W, H);

      for (let i = 0; i < bubbles.length; i++) {
        drawSoftBubble(bubbles[i]);
      }

      drawParticles();
      drawNozzle();
      drawPin();
    }

    function animate(now = 0) {
      updateEmission(now);
      updateBubbles();
      updatePinPop();
      updateParticles();
      draw();
      animationId = requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    animate();
  </script>
</body>
</html>
