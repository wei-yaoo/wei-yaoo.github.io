<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Interaction</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <canvas id="bubbleCanvas"></canvas>

  <script>
    const canvas = document.getElementById("bubbleCanvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let time = 0;

    let mouse = {
      x: 0,
      y: 0
    };

    let cluster = {
      x: 0,
      y: 0
    };

    let floatingBubbles = [];

    const colors = [
      "#1616a8",
      "#1e90ff",
      "#ff3bbf",
      "#ff7a00",
      "#39c94a",
      "#00bfa6",
      "#8b3cff"
    ];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

      mouse.x = width * 0.68;
      mouse.y = height * 0.5;

      cluster.x = mouse.x;
      cluster.y = mouse.y;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    window.addEventListener("mousemove", function(event) {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    window.addEventListener("click", function() {
      for (let i = 0; i < 16; i++) {
        createFloatingBubble();
      }
    });

    function drawMultiColorCircle(x, y, r, lineWidth = 3) {
      const part = Math.PI * 2 / colors.length;

      for (let i = 0; i < colors.length; i++) {
        ctx.beginPath();
        ctx.arc(x, y, r, i * part, (i + 1.1) * part);
        ctx.strokeStyle = colors[i];
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }

    function drawMultiColorLine(x1, y1, x2, y2, colorIndex, lineWidth = 3) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = colors[colorIndex % colors.length];
      ctx.lineWidth = lineWidth;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    function drawPolygon(points, lineWidth = 3) {
      for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = colors[i % colors.length];
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }

    function createHexagon(cx, cy, r, wobbleSeed) {
      const points = [];

      for (let i = 0; i < 6; i++) {
        const angle = Math.PI / 3 * i + Math.PI / 6;
        const wobble = Math.sin(time * 0.035 + i * 1.4 + wobbleSeed) * 2.2;

        points.push({
          x: cx + Math.cos(angle) * (r + wobble),
          y: cy + Math.sin(angle) * (r + wobble)
        });
      }

      return points;
    }

    function drawBubbleTool() {
      const baseX = width * 0.22;
      const baseY = height * 0.52;

      // 左边双圆
      drawMultiColorCircle(baseX - 130, baseY - 35, 18, 2.5);
      drawMultiColorCircle(baseX - 130, baseY + 10, 18, 2.5);

      // 手柄
      drawMultiColorLine(baseX - 38, baseY + 28, baseX - 38, baseY + 125, 0, 3);

      // 圆形吹泡泡口
      drawMultiColorCircle(baseX - 20, baseY, 32, 3);

      // 喇叭形出口
      drawMultiColorLine(baseX - 18, baseY - 32, baseX + 70, baseY - 14, 0, 3);
      drawMultiColorLine(baseX - 18, baseY + 32, baseX + 70, baseY + 14, 4, 3);
      drawMultiColorLine(baseX + 70, baseY - 14, baseX + 70, baseY + 14, 3, 3);

      // 出口小线条
      drawMultiColorLine(baseX + 92, baseY - 8, baseX + 126, baseY - 2, 3, 3);
      drawMultiColorLine(baseX + 126, baseY - 2, baseX + 154, baseY - 12, 2, 3);
      drawMultiColorLine(baseX + 154, baseY - 12, baseX + 174, baseY + 4, 5, 3);
    }

    function drawMiddleSmallBubbles() {
      const startX = width * 0.22 + 210;
      const startY = height * 0.52;

      for (let i = 0; i < 4; i++) {
        const x = startX + i * 52;
        const y = startY + Math.sin(time * 0.05 + i * 1.5) * 12;
        drawMultiColorCircle(x, y, 15, 2.5);
      }
    }

    function createFloatingBubble() {
      const startX = width * 0.22 + 170;
      const startY = height * 0.52;

      floatingBubbles.push({
        x: startX,
        y: startY + (Math.random() - 0.5) * 30,
        r: Math.random() * 10 + 8,
        vx: Math.random() * 2 + 1,
        vy: (Math.random() - 0.5) * 1.6,
        life: 1
      });
    }

    function updateFloatingBubbles() {
      if (Math.random() < 0.08) {
        createFloatingBubble();
      }

      for (let bubble of floatingBubbles) {
        const dx = cluster.x - bubble.x;
        const dy = cluster.y - bubble.y;

        bubble.vx += dx * 0.0007;
        bubble.vy += dy * 0.0007;

        bubble.x += bubble.vx;
        bubble.y += bubble.vy;

        bubble.life -= 0.004;
      }

      floatingBubbles = floatingBubbles.filter(bubble => bubble.life > 0);
    }

    function drawFloatingBubbles() {
      for (let bubble of floatingBubbles) {
        ctx.globalAlpha = bubble.life;
        drawMultiColorCircle(bubble.x, bubble.y, bubble.r, 2.2);
        ctx.globalAlpha = 1;
      }
    }

    function drawFoamCluster() {
      cluster.x += (mouse.x - cluster.x) * 0.045;
      cluster.y += (mouse.y - cluster.y) * 0.045;

      const cell = 34;
      const radiusX = 185;
      const radiusY = 118;

      for (let row = -5; row <= 5; row++) {
        for (let col = -8; col <= 8; col++) {
          const offsetX = row % 2 === 0 ? 0 : cell * 0.5;

          const x = cluster.x + col * cell + offsetX;
          const y = cluster.y + row * cell * 0.86;

          const dx = (x - cluster.x) / radiusX;
          const dy = (y - cluster.y) / radiusY;

          const distance = dx * dx + dy * dy;
          const edge = Math.sin(col * 1.7 + row * 2.2 + time * 0.025) * 0.18;

          if (distance < 1 + edge) {
            const points = createHexagon(x, y, cell * 0.56, col * 0.7 + row * 1.2);
            drawPolygon(points, 3);
          }
        }
      }

      // 外围较大泡泡，让形态更像参考图
      drawMultiColorCircle(cluster.x + radiusX * 0.55, cluster.y + 42, 58, 3);
      drawMultiColorCircle(cluster.x + radiusX * 0.74, cluster.y - 35, 34, 3);
      drawMultiColorCircle(cluster.x - radiusX * 0.78, cluster.y - 20, 26, 3);
    }

    function animate() {
      time++;

      ctx.clearRect(0, 0, width, height);

      drawBubbleTool();
      drawMiddleSmallBubbles();
      drawFoamCluster();

      updateFloatingBubbles();
      drawFloatingBubbles();

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
